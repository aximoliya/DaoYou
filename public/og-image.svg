<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9FCFF"/>
      <stop offset="55%" stop-color="#EFF5FE"/>
      <stop offset="100%" stop-color="#E1EBFB"/>
    </linearGradient>
    <radialGradient id="gA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#CFE1FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#CFE1FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DDE9FF" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#DDE9FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4E83F7"/>
      <stop offset="100%" stop-color="#709BFC"/>
    </linearGradient>
  </defs>

  <!-- 浅色国风底：渐变 + 柔光 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="120" cy="70" r="300" fill="url(#gA)"/>
  <circle cx="1100" cy="580" r="330" fill="url(#gB)"/>
  <circle cx="640" cy="10" r="240" fill="url(#gB)"/>
  <rect width="1200" height="6" fill="url(#bar)"/>

  <!-- 徽标胶囊 -->
  <rect x="430" y="86" width="340" height="50" rx="25" fill="#FFFFFF" stroke="#D3E2FB" stroke-width="1.5"/>
  <text x="600" y="120" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="23" fill="#3A6FE8">道友请留步 · 游戏攻略</text>

  <!-- 站点标题 -->
  <text x="600" y="256" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="86" font-weight="800" fill="#0E1B4B">道友攻略站</text>

  <!-- 分类 -->
  <text x="600" y="336" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" fill="#5B6B94">神仙 · 天书 · 星姬 · 幻仙 · 宠物 · 灵武</text>
  <text x="600" y="378" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="26" fill="#5B6B94">元神 · 法宝 · 装备 · 多选箱 · 日常商店</text>

  <line x1="450" y1="432" x2="750" y2="432" stroke="#C9DBF7" stroke-width="2" stroke-linecap="round"/>

  <!-- 网址 -->
  <text x="600" y="500" text-anchor="middle" font-family="Consolas, Courier New, monospace" font-size="23" fill="#4E6A99">aximoliya.github.io/DaoYou</text>

  <!-- 来源 -->
  <text x="600" y="546" text-anchor="middle" font-family="Microsoft YaHei, PingFang SC, sans-serif" font-size="19" fill="#8494B8">攻略来源：笑语@TapTap · 持续更新中</text>
</svg>
